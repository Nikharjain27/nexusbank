services:

  postgres:
    image: postgres:16-alpine
    container_name: nexusbank-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexusbank}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexusbank_secret}
      POSTGRES_DB: ${POSTGRES_DB:-nexusbank}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/init:/docker-entrypoint-initdb.d

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexusbank} -d ${POSTGRES_DB:-nexusbank}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - nexusbank-network


  redis:
    image: redis:7-alpine
    container_name: nexusbank-redis
    restart: unless-stopped

    command: redis-server --appendonly yes

    ports:
      - "${REDIS_PORT:-6379}:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - nexusbank-network


volumes:
  postgres_data:
    name: nexusbank-postgres-data

  redis_data:
    name: nexusbank-redis-data


networks:
  nexusbank-network:
    name: nexusbank-network
    driver: bridge