nexusbank:
  service:
    name: auth-service
    version: 1.0.0

spring:
  datasource:
    url: ${AUTH_DB_URL:jdbc:postgresql://localhost:5432/nexusbank_auth}
    username: ${AUTH_DB_USERNAME:nexusbank_auth_user}
    password: ${AUTH_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari:
      pool-name: NexusBankAuthPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

info:
  application:
    name: NEXUSBANK Auth Service
    description: Authentication and authorization service

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

security:
  jwt:
    secret: change-this-to-a-long-random-secret-key-for-development-only-please-change-it
    access-token-expiration: 15m