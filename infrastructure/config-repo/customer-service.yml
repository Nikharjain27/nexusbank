nexusbank:
  service:
    name: customer-service
    version: 1.0.0

info:
  application:
    name: NEXUSBANK Customer Service
    description: Customer profile and lifecycle management service

spring:
  datasource:
    url: ${CUSTOMER_DB_URL:jdbc:postgresql://localhost:5432/nexusbank_customer}
    username: ${CUSTOMER_DB_USERNAME:nexusbank_customer_user}
    password: ${CUSTOMER_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: NexusBankCustomerPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

security:
  jwt:
    secret: ${JWT_SECRET}